
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: electrostock
      POSTGRES_USER: electrostock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electrostock -d electrostock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/electrostock
      DB_USER: electrostock
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
